seed = 5

[data]
normalization = 'quantile'
path = 'rtdl_revisiting_models/data/california_housing'
y_policy = 'mean_std'

[model]
activation = 'reglu'
attention_dropout = 0.29594303876703743
d_ffn_factor = 2.3113268419681248
d_token = 208
ffn_dropout = 0.13137320435210736
